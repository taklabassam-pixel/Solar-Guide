<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>أطلس ودليل الطاقة الشمسية</title>
    
    <!-- أيقونة المتصفح والشاشة الرئيسية (مسار نسبي يعمل محلياً وعلى GitHub Pages) -->
    <link rel="icon" type="image/png" href="./icon.png" />
    <link rel="apple-touch-icon" href="./icon.png" />

    <!-- ضبط ألوان شريط الحالة وتحديث الأوسمة لملائمة المعايير الحديثة -->
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <script>
      // تتبع استدعاء الأيقونة ومعرفة حالتها في الكونسول
      window.addEventListener('DOMContentLoaded', () => {
        const iconLink = document.querySelector('link[rel="icon"]');
        if (iconLink) {
          const img = new Image();
          img.src = iconLink.href;
          img.onload = () => console.log('✅ [Icon Tracker] تم تحميل الأيقونة بنجاح من المسار:', img.src);
          img.onerror = () => console.error('❌ [Icon Tracker] فشل استدعاء الأيقونة! تحقق من وجود الملف في المسار:', img.src);
        } else {
          console.warn('⚠️ [Icon Tracker] لم يتم العثور على وسم <link rel="icon"> في الصفحة!');
        }
      });
    </script>

    <link rel="stylesheet" crossorigin href="/Solar-Guide/assets/index-CmsLCZ2H.css">
  </head>

  </body>
</html>
